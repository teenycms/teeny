<div class="cd">
  {{#title}}<p class="cd__title">{{title}}</p>{{/title}}
  <div class="cd__grid" aria-live="polite">
    <div><b data-unit="d">0</b><span>days</span></div>
    <div><b data-unit="h">0</b><span>hours</span></div>
    <div><b data-unit="m">0</b><span>minutes</span></div>
    <div><b data-unit="s">0</b><span>seconds</span></div>
  </div>
  <p class="cd__done" hidden>{{done}}</p>
</div>
