<section class="lc">
  <div class="lc__card">
    {{#title}}<h2 class="lc__title">{{title}}</h2>{{/title}}
    <div class="lc__cols">
      {{#address}}<div><p class="lc__label">Address</p><p class="lc__text">{{address}}</p></div>{{/address}}
      {{#hours}}<div><p class="lc__label">Open</p><p class="lc__text">{{hours}}</p></div>{{/hours}}
    </div>
    {{#map}}<p class="lc__action"><a class="lc__btn" href="{{map}}">{{button}}</a></p>{{/map}}
  </div>
</section>
